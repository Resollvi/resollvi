services:
  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - api

  api:
    build:
      context: ./apps/api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
